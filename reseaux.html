<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>NMO — Réseaux</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237C3AED'/><stop offset='1' stop-color='%23A855F7'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><circle cx='10' cy='10' r='2.5' fill='white'/><circle cx='22' cy='10' r='2.5' fill='white'/><circle cx='16' cy='22' r='2.5' fill='white'/><circle cx='16' cy='14' r='2' fill='white' opacity='.6'/><line x1='10' y1='10' x2='22' y2='10' stroke='white' stroke-width='1.2' opacity='.5'/><line x1='10' y1='10' x2='16' y2='22' stroke='white' stroke-width='1.2' opacity='.5'/><line x1='22' y1='10' x2='16' y2='22' stroke='white' stroke-width='1.2' opacity='.5'/><line x1='16' y1='14' x2='10' y2='10' stroke='white' stroke-width='1' opacity='.35'/><line x1='16' y1='14' x2='22' y2='10' stroke='white' stroke-width='1' opacity='.35'/><line x1='16' y1='14' x2='16' y2='22' stroke='white' stroke-width='1' opacity='.35'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F5F5F7;--white:#FFF;--black:#1D1D1F;
      --g1:#F0F0F2;--g2:#E0E0E4;--g3:#C4C4C8;--g4:#8E8E93;--g5:#636366;
      --accent:#7C3AED;--green:#34C759;--amber:#FF9F0A;--red:#FF3B30;
      --tiktok:#000;--twitter:#000;--facebook:#1877F2;
      --youtube:#FF0000;--insta:#E4405F;--linkedin:#0A66C2;
      --r:16px;
      --ease:cubic-bezier(.22,1,.36,1);
      --sh:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
      --sh-md:0 4px 12px rgba(0,0,0,0.08);
    }
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--black);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;display:flex}

    /* ======= SIDEBAR ======= */
    .sidebar{
      width:280px;min-height:100vh;background:var(--white);
      display:flex;flex-direction:column;
      position:fixed;left:0;top:0;bottom:0;z-index:10;
      transition:transform 350ms var(--ease);
      box-shadow:1px 0 0 var(--g2);
    }
    .sidebar.closed{transform:translateX(-280px)}
    .sb-head{padding:24px;border-bottom:1px solid var(--g1)}
    .sb-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .sb-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#A855F7);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;box-shadow:0 2px 8px rgba(124,58,237,0.25)}
    .sb-title{font-size:19px;font-weight:900;letter-spacing:-0.04em}
    .sb-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--g5);text-decoration:none;font-weight:500;transition:color 200ms}
    .sb-back:hover{color:var(--accent)}

    .sb-label{padding:18px 20px 8px;font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:0.1em}
    .sb-nav{flex:1;overflow-y:auto;padding:4px 10px}
    .sb-item{
      display:flex;align-items:center;gap:12px;
      padding:10px 14px;margin-bottom:2px;border-radius:12px;
      cursor:pointer;transition:all 200ms var(--ease);
      border:none;background:none;width:100%;text-align:left;font:inherit;color:var(--black);
    }
    .sb-item:hover{background:var(--g1)}
    .sb-item.active{background:var(--black);color:#fff;box-shadow:var(--sh)}
    .sb-item.active .sb-cnt{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7)}
    .sb-item.active .sb-role{color:rgba(255,255,255,0.5)}
    .sb-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sb-ico svg{width:16px;height:16px;fill:white}
    .sb-info{flex:1;min-width:0}
    .sb-name{font-size:13px;font-weight:700;display:block;letter-spacing:-0.01em}
    .sb-role{font-size:10px;color:var(--g4);display:block;margin-top:1px;font-weight:500}
    .sb-cnt{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--g1);color:var(--g4);white-space:nowrap}

    .sb-foot{padding:16px 24px;border-top:1px solid var(--g1);font-size:11px;color:var(--g4)}

    /* ======= MAIN ======= */
    .main{flex:1;margin-left:280px;min-height:100vh;transition:margin-left 350ms var(--ease)}
    .main.full{margin-left:0}

    /* Topbar */
    .topbar{
      display:flex;align-items:center;gap:14px;
      padding:14px 32px;background:rgba(255,255,255,0.8);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid var(--g2);
      position:sticky;top:0;z-index:5;
    }
    .tb-toggle{
      width:36px;height:36px;border:1px solid var(--g2);background:var(--white);
      border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--g5);transition:all 200ms;
    }
    .tb-toggle:hover{background:var(--g1);color:var(--black)}
    .tb-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .tb-plat{display:flex;align-items:center;gap:10px}
    .tb-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
    .tb-ico svg{width:14px;height:14px;fill:white}
    .tb-title{font-size:18px;font-weight:800;letter-spacing:-0.03em;flex:1}
    .month-nav{display:flex;align-items:center;gap:6px}
    .month-label{font-size:14px;font-weight:700;min-width:200px;text-align:center;letter-spacing:-0.02em}
    .nav-btn{
      width:32px;height:32px;border:1px solid var(--g2);background:var(--white);
      border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--g5);transition:all 200ms;
    }
    .nav-btn:hover{background:var(--g1);color:var(--black)}
    .nav-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .today-btn{
      height:32px;padding:0 14px;border:none;background:var(--black);
      border-radius:8px;font:inherit;font-size:11px;font-weight:700;color:#fff;
      cursor:pointer;transition:all 200ms;
    }
    .today-btn:hover{opacity:0.85}

    /* Content area */
    .content{padding:24px 32px}

    /* ======= PROGRESS BAR ======= */
    .progress-bar{
      display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px 20px;
      background:var(--white);border-radius:var(--r);box-shadow:var(--sh);
    }
    .pr-ring{position:relative;width:52px;height:52px;flex-shrink:0}
    .pr-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
    .pr-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
    .pr-ring .bg{stroke:var(--g1)}
    .pr-ring .fg{transition:stroke-dashoffset 600ms var(--ease)}
    .pr-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
    .pr-stats{display:flex;gap:24px;flex:1}
    .pr-stat-val{font-size:22px;font-weight:900;letter-spacing:-0.04em;line-height:1}
    .pr-stat-lbl{font-size:10px;color:var(--g4);font-weight:600;margin-top:3px}

    /* ======= CALENDAR ======= */
    .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:0}
    .cal-hd{padding:10px 0;text-align:center;font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:0.1em}
    .cal-grid{
      display:grid;grid-template-columns:repeat(7,1fr);gap:0;
      background:var(--white);border:1px solid var(--g2);
      border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);
    }
    .cal-cell{
      min-height:120px;padding:8px;
      border-right:1px solid var(--g1);border-bottom:1px solid var(--g1);
      background:var(--white);transition:background 200ms;
    }
    .cal-cell:nth-child(7n){border-right:none}
    .cal-cell:hover{background:#FAFAFF}
    .cal-cell.today{background:linear-gradient(135deg,#F5F3FF,#EDE9FE)}
    .cal-cell.other{background:var(--bg);opacity:0.5}
    .cal-cell.start-marker{box-shadow:inset 0 3px 0 var(--accent)}
    .cal-day{font-size:12px;font-weight:700;color:var(--g4);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
    .cal-day.today{color:var(--accent)}
    .cal-today-dot{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(124,58,237,0.3)}
    .cal-badge{font-size:8px;font-weight:700;padding:1px 6px;border-radius:4px}

    .cal-tk{
      display:flex;align-items:center;gap:4px;
      padding:3px 5px;margin-bottom:2px;border-radius:5px;
      font-size:10px;font-weight:500;transition:all 150ms;cursor:pointer;
    }
    .cal-tk:hover{transform:translateX(2px);box-shadow:var(--sh-md)}
    .cal-tk.done{opacity:0.3;text-decoration:line-through}
    .cal-tk-ico{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cal-tk-ico svg{width:8px;height:8px;fill:white}
    .cal-tk-lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cal-tk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;border:2px solid var(--g3)}
    .cal-tk-dot.prep{border-color:var(--amber);background:rgba(255,159,10,0.3)}
    .cal-tk-dot.pub{border-color:var(--green);background:var(--green)}

    /* ======= MODAL PRODUCTION ======= */
    .modal-overlay{
      position:fixed;inset:0;z-index:100;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;
      animation:fadeIn 200ms var(--ease);
      padding:20px;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .modal{
      width:100%;max-width:900px;max-height:calc(100vh - 40px);
      background:var(--white);border-radius:20px;
      box-shadow:0 25px 60px rgba(0,0,0,0.2);
      display:flex;flex-direction:column;
      animation:slideUp 300ms var(--ease);
      overflow:hidden;
    }

    /* Modal Header */
    .m-header{
      display:flex;align-items:center;gap:14px;
      padding:20px 28px;border-bottom:1px solid var(--g1);
      flex-shrink:0;
    }
    .m-plat-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .m-plat-ico svg{width:18px;height:18px;fill:white}
    .m-header-info{flex:1;min-width:0}
    .m-header-title{font-size:18px;font-weight:800;letter-spacing:-0.03em}
    .m-header-sub{font-size:12px;color:var(--g4);font-weight:500;margin-top:1px}
    .m-save-status{font-size:11px;color:var(--green);font-weight:600;opacity:0;transition:opacity 300ms}
    .m-save-status.show{opacity:1}
    .m-close{
      width:36px;height:36px;border-radius:10px;border:1px solid var(--g2);
      background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--g4);font-size:18px;font-weight:700;transition:all 200ms;flex-shrink:0;
    }
    .m-close:hover{background:var(--g1);color:var(--black)}

    /* Modal Body — Scrollable */
    .m-body{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:24px}

    /* Framework pills */
    .m-fw{display:flex;flex-wrap:wrap;gap:6px}
    .m-fw-pill{
      padding:6px 14px;border-radius:20px;border:1.5px solid var(--g2);
      background:var(--white);font:inherit;font-size:12px;font-weight:600;
      cursor:pointer;transition:all 200ms;color:var(--g5);
    }
    .m-fw-pill:hover{border-color:var(--g3);background:var(--g1)}
    .m-fw-pill.on{border-color:currentColor;color:var(--white);background:var(--black)}
    .m-fw-steps{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:10px 14px;background:var(--g1);border-radius:10px;
      font-size:11px;font-weight:600;color:var(--g5);margin-top:8px;
    }
    .m-fw-arrow{color:var(--g3);font-size:12px}

    /* Content fields */
    .m-section-title{font-size:11px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
    .m-fields{display:flex;flex-direction:column;gap:14px}
    .m-field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--black)}
    .m-field input,.m-field textarea{
      width:100%;padding:10px 14px;border:1.5px solid var(--g2);border-radius:10px;
      font:inherit;font-size:13px;line-height:1.5;
      background:var(--white);transition:border-color 200ms;resize:vertical;
    }
    .m-field input:focus,.m-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.08)}
    .m-field input::placeholder,.m-field textarea::placeholder{color:var(--g3);font-size:12px}
    .m-field textarea{min-height:80px}

    /* Tips */
    .m-tips{padding:14px;background:#FFFBEB;border-radius:10px;border:1px solid #FDE68A}
    .m-tips-title{font-size:11px;font-weight:700;color:#92400E;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
    .m-tip{font-size:12px;color:#78350F;margin-bottom:4px;padding-left:14px;position:relative}
    .m-tip::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:#F59E0B}

    /* Adaptation plateforme */
    .m-adapt{display:flex;flex-direction:column;gap:10px}
    .m-adapt-area{position:relative}
    .m-adapt textarea{
      width:100%;padding:14px;border:1.5px solid var(--g2);border-radius:10px;
      font:inherit;font-size:13px;line-height:1.6;resize:vertical;min-height:100px;
      transition:border-color 200ms;
    }
    .m-adapt textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.08)}
    .m-adapt textarea::placeholder{color:var(--g3);font-size:12px}
    .m-char{
      display:flex;align-items:center;justify-content:space-between;
      font-size:11px;font-weight:600;padding:0 4px;
    }
    .m-char-count{font-variant-numeric:tabular-nums}
    .m-char.ok .m-char-count{color:var(--g4)}
    .m-char.warn .m-char-count{color:var(--amber)}
    .m-char.over .m-char-count{color:var(--red)}
    .m-char-opt{color:var(--g4)}
    .m-char-bar{height:3px;border-radius:2px;background:var(--g1);margin-top:4px;overflow:hidden}
    .m-char-bar-fill{height:100%;border-radius:2px;transition:width 200ms,background 200ms}

    /* Steps + Publish — Bottom bar */
    .m-sidebar{display:flex;flex-direction:column;gap:16px}
    .m-steps{display:flex;flex-direction:column;gap:4px}
    .m-step{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;border-radius:8px;cursor:pointer;
      transition:background 150ms;font-size:12px;
    }
    .m-step:hover{background:var(--g1)}
    .m-step-check{
      width:20px;height:20px;border-radius:6px;border:2px solid var(--g3);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
      transition:all 200ms;font-size:11px;
    }
    .m-step-check.on{background:var(--green);border-color:var(--green);color:#fff}
    .m-step-name{font-weight:500;color:var(--g5)}
    .m-step.on .m-step-name{text-decoration:line-through;opacity:0.4}

    /* Checklist qualité */
    .m-cl-items{display:flex;flex-direction:column;gap:2px}
    .m-cl-item{
      display:flex;align-items:center;gap:8px;
      padding:6px 12px;border-radius:6px;cursor:pointer;
      font-size:12px;color:var(--g5);transition:background 150ms;
    }
    .m-cl-item:hover{background:var(--g1)}
    .m-cl-box{
      width:16px;height:16px;border-radius:4px;border:2px solid var(--g3);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
      transition:all 200ms;font-size:9px;
    }
    .m-cl-box.on{background:var(--accent);border-color:var(--accent);color:#fff}

    /* Publish button */
    .m-pub{
      padding:14px;border:none;border-radius:12px;
      font:inherit;font-size:14px;font-weight:700;cursor:pointer;
      width:100%;transition:all 200ms;text-align:center;
    }
    .m-pub.not-ready{background:var(--g1);color:var(--g4);cursor:not-allowed}
    .m-pub.ready{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(52,199,89,0.3)}
    .m-pub.ready:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(52,199,89,0.35)}
    .m-pub.published{background:var(--g1);color:var(--green);border:2px solid var(--green)}

    /* Insights création (NETGUIDE allégé) */
    .m-insights{margin-top:4px}
    .m-insights-title{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--g5);text-transform:uppercase;letter-spacing:0.04em}
    .m-insight{
      padding:8px 12px;border-radius:8px;margin-bottom:6px;
      border-left:3px solid var(--g3);background:var(--g1);
      font-size:12px;line-height:1.5;
    }
    .m-insight-tag{
      display:inline-block;padding:1px 6px;border-radius:4px;margin-right:4px;
      font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    }
    .m-insight-tag.tip{background:#D1FAE5;color:#047857}
    .m-insight-tag.warn{background:#FEE2E2;color:#B91C1C}
    .m-insight.tip{border-left-color:#10B981;background:#ECFDF5}
    .m-insight.warn{border-left-color:#EF4444;background:#FEF2F2}

    /* Two-column layout inside modal body */
    .m-cols{display:grid;grid-template-columns:1fr 280px;gap:28px}
    .m-col-main{display:flex;flex-direction:column;gap:20px;min-width:0}
    .m-col-side{display:flex;flex-direction:column;gap:16px}

    /* Dark mode */
    body.dark{
      --bg:#1C1C1E;--white:#2C2C2E;--black:#F5F5F7;
      --g1:#3A3A3C;--g2:#48484A;--g3:#636366;--g4:#8E8E93;--g5:#AEAEB2;
    }
    body.dark .m-tips{background:#3A2A0A;border-color:#5C4000}
    body.dark .m-tips-title{color:#D4A000}
    body.dark .m-tip{color:#E5C040}
    body.dark .m-tip::before{background:#D4A000}
    body.dark .m-insight.warn{background:#3B1C1C;border-left-color:#EF4444}
    body.dark .m-insight.tip{background:#1C3B2A;border-left-color:#10B981}
    body.dark .m-insight-tag.warn{background:#5C2020;color:#FCA5A5}
    body.dark .m-insight-tag.tip{background:#1A4030;color:#6EE7B7}
    body.dark .cal-cell.today{background:linear-gradient(135deg,#2D2640,#3A2860)}
    body.dark .modal-overlay{background:rgba(0,0,0,0.7)}
    body.dark .cal-cell:hover{background:#333}
    body.dark input,body.dark textarea{background:var(--bg);color:var(--black);border-color:var(--g2)}
    body.dark input:focus,body.dark textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
    .dark-toggle{
      display:flex;align-items:center;gap:8px;cursor:pointer;
      border:none;background:none;font:inherit;font-size:12px;color:var(--g4);
      padding:4px 0;transition:color 200ms;
    }
    .dark-toggle:hover{color:var(--black)}
    .dark-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* Sync */
    .sync-btn{
      display:flex;align-items:center;gap:6px;cursor:pointer;
      border:none;background:none;font:inherit;font-size:11px;color:var(--g4);
      padding:4px 0;transition:all 200ms;
    }
    .sync-btn:hover{color:var(--accent)}
    .sync-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sync-btn.syncing svg{animation:spin 1s linear infinite}
    .sync-btn.ok{color:var(--green)}
    .sync-btn.err{color:var(--red)}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .sync-setup{

      cursor:pointer;border:none;transition:all 200ms;
    }
    .sync-box-btns .primary{background:var(--accent);color:#fff}
    .sync-box-btns .primary:hover{opacity:0.9}

    .sv-card-dot.pub{background:var(--green)}
    .sv-card-dot.prep{background:var(--amber)}

    /* Responsive */
    @media(max-width:900px){
      .sidebar{transform:translateX(-280px)}

// =============================================
// HELPERS
// =============================================
function getMonday(d){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()-day+(day===0?-6:1));x.setHours(0,0,0,0);return x;}
function wk(d){return d.toISOString().split('T')[0];}
function today(){const t=new Date();t.setHours(0,0,0,0);return t;}
function load(ws,m){const r=localStorage.getItem("nmo_"+m+"_"+wk(ws));return r?JSON.parse(r):{};}
function getPrepSteps(data,d,i){
  const k=d+"_"+i,steps=CT[PLAN[d][i].t],val=data[k];
  if(!val)return new Array(steps.length).fill(false);
  if(val===true)return new Array(steps.length).fill(true);
  if(Array.isArray(val))return steps.map((_,j)=>!!val[j]);
  return new Array(steps.length).fill(false);
}
function isPrepDone(data,d,i){return getPrepSteps(data,d,i).every(Boolean);}
function brandBg(pid){return "background:"+BRAND[pid].bg;}

function toggleStep(monday,d,i,stepIdx){
  const key="nmo_prep_"+wk(monday);
  const data=JSON.parse(localStorage.getItem(key)||"{}");
  const k=d+"_"+i;
  const steps=CT[PLAN[d][i].t];
  let arr=data[k];
  if(!arr||arr===true)arr=new Array(steps.length).fill(arr===true);
  if(Array.isArray(arr)){arr=steps.map((_,j)=>!!arr[j]);}
  arr[stepIdx]=!arr[stepIdx];
  data[k]=arr.every(Boolean)?true:arr;
  localStorage.setItem(key,JSON.stringify(data));
}
function togglePub(monday,d,i){
  const key="nmo_pub_"+wk(monday);
  const data=JSON.parse(localStorage.getItem(key)||"{}");
  const k=d+"_"+i;
  data[k]=!data[k];
  if(!data[k])delete data[k];
  localStorage.setItem(key,JSON.stringify(data));
}

function getTasksForDate(date){
  const dayIdx=(date.getDay()+6)%7;
  const monday=getMonday(date);
  const prep=load(monday,"prep");
  const pub=load(monday,"pub");
  const tasks=[];
  if(dayIdx>=0&&dayIdx<7){
    const effective=getEffectivePlan(dayIdx,monday);
    effective.forEach(tk=>{
      const i=tk._i;
      if(activePlat&&tk.p!==activePlat)return;
      const isDone=!!pub[dayIdx+"_"+i];
      const isPrepped=isPrepDone(prep,dayIdx,i);
      tasks.push({tk,i,d:dayIdx,isDone,isPrepped});
    });
  }
  return tasks;
}
function getTasksForSeries(seriesKey,monday){
  const prep=load(monday,"prep");
  const pub=load(monday,"pub");
  const tasks=[];
  for(let d=0;d<7;d++){
    const effective=getEffectivePlan(d,monday);
    effective.forEach(tk=>{
      if(tk.f!==seriesKey)return;
      if(activePlat&&tk.p!==activePlat)return;
      const i=tk._i;
      const isDone=!!pub[d+"_"+i];
      const isPrepped=isPrepDone(prep,d,i);
      tasks.push({tk,i,d,isDone,isPrepped});
    });
  }
  return tasks;
}

// Day overrides — masquer/réorganiser les tâches d'un jour
function loadOverrides(monday){const r=localStorage.getItem("nmo_rx_over_"+wk(monday));return r?JSON.parse(r):{};}
function saveOverrides(monday,data){localStorage.setItem("nmo_rx_over_"+wk(monday),JSON.stringify(data));}
function getEffectivePlan(d,monday){
  const ov=loadOverrides(monday);
  const k=d+"";
  const base=PLAN[d];
  if(!ov[k])return base.map((t,i)=>({...t,_i:i}));
  const {hidden,order}=ov[k];
  let indices=order||base.map((_,i)=>i);
  if(hidden&&hidden.length)indices=indices.filter(i=>!hidden.includes(i));
  return indices.map(i=>({...base[i],_i:i}));
}

// Streak — jours consécutifs avec au moins 1 publication
function calcStreak(){
  let streak=0;
  const d=new Date();d.setHours(0,0,0,0);
  for(let attempts=0;attempts<365;attempts++){
    const dayIdx=(d.getDay()+6)%7;
    const monday=getMonday(d);
    const pub=load(monday,"pub");
    let hasAny=false;
    PLAN[dayIdx].forEach((_,i)=>{if(pub[dayIdx+"_"+i])hasAny=true;});
    if(!hasAny)break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

// --- PROGRESS ---
function renderProgress(){
  const monday=getMonday(today());
  const prep=load(monday,"prep");
  const pub=load(monday,"pub");
  let total=0,prepDone=0,pubDone=0;
  for(let d=0;d<7;d++)PLAN[d].forEach((tk,i)=>{
    if(activePlat&&tk.p!==activePlat)return;
    total++;
    if(isPrepDone(prep,d,i))prepDone++;
    if(pub[d+"_"+i])pubDone++;
  });
  const pct=total>0?Math.round(pubDone/total*100):0;
  const col=pct>=75?"var(--green)":pct>=40?"var(--amber)":"var(--accent)";
  const circ=2*Math.PI*20;
  const off=circ-(pct/100)*circ;
  document.getElementById("progress").innerHTML=`<div class="progress-bar">
    <div class="pr-ring">
      <svg viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="20"/><circle class="fg" cx="26" cy="26" r="20" stroke="${col}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
      <div class="pr-pct" style="color:${col}">${pct}%</div>
    </div>
    <div class="pr-stats">
      <div><div class="pr-stat-val" style="color:var(--amber)">${prepDone}</div><div class="pr-stat-lbl">Préparés</div></div>
      <div><div class="pr-stat-val" style="color:var(--green)">${pubDone}</div><div class="pr-stat-lbl">Publiés</div></div>
      <div><div class="pr-stat-val" style="color:var(--red)">${total-pubDone}</div><div class="pr-stat-lbl">Restants</div></div>
      <div><div class="pr-stat-val">${total}</div><div class="pr-stat-lbl">Total</div></div>
      <div><div class="pr-stat-val" style="color:var(--amber)">${calcStreak()}</div><div class="pr-stat-lbl">Streak</div></div>
    </div>
  </div>`;
}

// --- CALENDAR ---
function renderCalendar(){
  const todayStr=today().toDateString();

  // ========== VUE SÉRIE ==========
  if(viewMode==="series"){
    let monday;
    if(startDate){
      monday=getMonday(startDate);
      monday=new Date(monday.getTime()+viewOffset*7*86400000);
    }else{
      monday=getMonday(viewDate);
    }
    const endDate=new Date(monday.getTime()+6*86400000);
    const m1=MONTHS[monday.getMonth()].substring(0,3);
    const m2=MONTHS[endDate.getMonth()].substring(0,3);
    const label=`Semaine du ${monday.getDate()} ${m1===m2?m1:m1+" \u2014 "+endDate.getDate()+" "+m2} ${endDate.getFullYear()}`;
    document.getElementById("monthLabel").textContent=label;
    document.getElementById("calHead").innerHTML="";

    let h="";
    for(const [sk,ser] of Object.entries(SERIES)){
      const tasks=getTasksForSeries(sk,monday);
      if(tasks.length===0)continue;
      const done=tasks.filter(t=>t.isDone).length;
      const col=ser.color;
      h+=`<div class="sv-lane">`;
      h+=`<div class="sv-head">`;
      h+=`<div class="sv-ico" style="background:${col}20">${ser.icon}</div>`;
      h+=`<span class="sv-name" style="color:${col}">${ser.name}</span>`;
      h+=`<span class="sv-full">${ser.full}</span>`;
      h+=`<span class="sv-count" style="background:${col}15;color:${col}">${done}/${tasks.length}</span>`;
      h+=`</div>`;
      h+=`<div class="sv-tasks">`;
      tasks.forEach(({tk,i,d,isDone,isPrepped})=>{
        const ds=new Date(monday.getTime()+d*86400000).toISOString().split("T")[0];
        const dotCls=isDone?"pub":isPrepped?"prep":"";
        h+=`<div class="sv-card${isDone?" done":""}" data-tk="${ds}_${d}_${i}" style="background:${col}08;border-color:${col}20">`;
        h+=`<div class="sv-card-day">${DAYS_SHORT[d]}</div>`;
        h+=`<div class="sv-card-plat"><div class="sv-card-ico" style="${brandBg(tk.p)}"><span style="fill:${BRAND[tk.p].text};color:${BRAND[tk.p].text}">${ICONS[tk.p]}</span></div><span style="font-size:10px;font-weight:600">${P[tk.p].name}</span></div>`;
        h+=`<div class="sv-card-lbl">${tk.l}</div>`;
        h+=`<div class="sv-card-type">${tk.t}</div>`;
        h+=`<div class="sv-card-dot ${dotCls}"></div>`;
        h+=`</div>`;
      });
      h+=`</div></div>`;
    }
    document.getElementById("calendar").innerHTML=h;

    // Event : clic sur une carte → modal
    document.querySelectorAll(".sv-card[data-tk]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const parts=el.dataset.tk.split("_");
        const ds=parts[0],d=parseInt(parts[1]),i=parseInt(parts[2]);
        const mon=getMonday(new Date(ds+"T00:00:00"));
        modalTask={date:ds,d,i,monday:mon};
        modalAdaptPlatform=PLAN[d][i].p;
        renderModal();
      });
    });
    document.getElementById("viewToggle").title="Mois \u2192 Semaine \u2192 S\u00e9rie";
    return;
  }

  // ========== VUE CALENDRIER (MOIS / SEMAINE) ==========
  let firstMonday, numWeeks, label;

  if(viewMode==="week"){
    // Vue semaine : 1 seule semaine
    if(startDate){
      firstMonday=getMonday(startDate);
      firstMonday=new Date(firstMonday.getTime()+viewOffset*7*86400000);
    }else{
      firstMonday=getMonday(viewDate);
    }
    numWeeks=1;
    const endDate=new Date(firstMonday.getTime()+6*86400000);
    const m1=MONTHS[firstMonday.getMonth()].substring(0,3);
    const m2=MONTHS[endDate.getMonth()].substring(0,3);
    label=`Semaine du ${firstMonday.getDate()} ${m1===m2?m1:m1+" \u2014 "+endDate.getDate()+" "+m2} ${endDate.getFullYear()}`;
  }else if(startDate){
    firstMonday=getMonday(startDate);
    firstMonday=new Date(firstMonday.getTime()+viewOffset*7*86400000);
    numWeeks=5;
    const endDate=new Date(firstMonday.getTime()+(numWeeks*7-1)*86400000);
    const m1=MONTHS[firstMonday.getMonth()].substring(0,3);
    const m2=MONTHS[endDate.getMonth()].substring(0,3);
    label=m1===m2?`${firstMonday.getDate()} \u2014 ${endDate.getDate()} ${m2} ${endDate.getFullYear()}`:`${firstMonday.getDate()} ${m1} \u2014 ${endDate.getDate()} ${m2} ${endDate.getFullYear()}`;
  }else{
    const year=viewDate.getFullYear(),month=viewDate.getMonth();
    const firstDay=new Date(year,month,1);
    const lastDay=new Date(year,month+1,0);
    const startOffset=(firstDay.getDay()+6)%7;
    firstMonday=new Date(year,month,1-startOffset);
    const totalCells=startOffset+lastDay.getDate();
    numWeeks=Math.ceil(totalCells/7);
    label=MONTHS[month]+" "+year;
  }

  document.getElementById("monthLabel").textContent=label;
  document.getElementById("calHead").innerHTML=`<div class="cal-head">${DAYS_SHORT.map(d=>`<div class="cal-hd">${d}</div>`).join("")}</div>`;

  let h=`<div class="cal-grid${viewMode==="week"?" week-view":""}">`;
  for(let w=0;w<numWeeks;w++){
    for(let d=0;d<7;d++){
      const date=new Date(firstMonday.getTime()+(w*7+d)*86400000);
      const isToday=date.toDateString()===todayStr;
      let isOther=false;
      if(!startDate&&viewMode!=="week"){isOther=date.getMonth()!==viewDate.getMonth();}
      h+=renderCell(date,isOther,isToday);
    }
  }
  h+='</div>';
  document.getElementById("calendar").innerHTML=h;

  // Clic sur une tâche = ouvrir le MODAL
  document.querySelectorAll(".cal-tk[data-tk]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const parts=el.dataset.tk.split("_");
      const ds=parts[0],d=parseInt(parts[1]),i=parseInt(parts[2]);
      const monday=getMonday(new Date(ds+"T00:00:00"));
      modalTask={date:ds,d,i,monday};
      modalAdaptPlatform=PLAN[d][i].p; // pré-sélectionner la plateforme de la tâche
      renderModal();
    });
  });

  // Double-clic sur cellule = définir le point de départ
  document.querySelectorAll(".cal-cell[data-date]").forEach(cell=>{
    cell.addEventListener("dblclick",()=>{
      const d=new Date(cell.dataset.date+"T00:00:00");
      if(startDate&&d.toDateString()===startDate.toDateString()){
        startDate=null;viewOffset=0;localStorage.removeItem("nmo_rx_start");
      }else{
        startDate=d;viewOffset=0;localStorage.setItem("nmo_rx_start",cell.dataset.date);
      }
      render();
    });
  });

  // Edit button (crayon) = toggle day editor
  document.querySelectorAll(".cal-edit-btn[data-edit]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const [mon,dIdx]=btn.dataset.edit.split("_");
      const d=parseInt(dIdx);
      const monday=new Date(mon+"T00:00:00");
      if(editingDay&&editingDay.d===d&&wk(editingDay.monday)===mon){
        editingDay=null;
      }else{
        editingDay={monday,d};
      }
      render();
    });
  });

  // Toggle hide/show task in day editor
  document.querySelectorAll(".de-toggle[data-deh]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(!editingDay)return;
      const idx=parseInt(btn.dataset.deh);
      const {monday,d}=editingDay;
      const ov=loadOverrides(monday);
      const k=d+"";
      if(!ov[k])ov[k]={hidden:[],order:PLAN[d].map((_,i)=>i)};
      const hi=ov[k].hidden||(ov[k].hidden=[]);
      const pos=hi.indexOf(idx);
      if(pos>-1)hi.splice(pos,1);else hi.push(idx);
      saveOverrides(monday,ov);
      render();
    });
  });

  // Drag & drop reorder in day editor
  document.querySelectorAll(".de-item[draggable]").forEach(item=>{
    item.addEventListener("dragstart",(e)=>{
      e.dataTransfer.setData("text/plain",item.dataset.dei);
      item.style.opacity="0.4";
    });
    item.addEventListener("dragend",()=>{item.style.opacity="1";});
    item.addEventListener("dragover",(e)=>{
      e.preventDefault();
      item.style.borderTop="2px solid var(--accent)";
    });
    item.addEventListener("dragleave",()=>{item.style.borderTop="none";});
    item.addEventListener("drop",(e)=>{
      e.preventDefault();
      item.style.borderTop="none";
      if(!editingDay)return;
      const fromIdx=parseInt(e.dataTransfer.getData("text/plain"));
      const toIdx=parseInt(item.dataset.dei);
      if(fromIdx===toIdx)return;
      const {monday,d}=editingDay;
      const ov=loadOverrides(monday);
      const k=d+"";
      if(!ov[k])ov[k]={hidden:[],order:PLAN[d].map((_,i)=>i)};
      const order=ov[k].order||(ov[k].order=PLAN[d].map((_,i)=>i));
      const fPos=order.indexOf(fromIdx);
      const tPos=order.indexOf(toIdx);
      if(fPos>-1&&tPos>-1){
        order.splice(fPos,1);
        order.splice(tPos,0,fromIdx);
      }
      saveOverrides(monday,ov);
      render();
    });
  });

  // Touch drag for iPad — bind touchstart on handles only (per-render)
  document.querySelectorAll(".de-handle").forEach(handle=>{
    handle.addEventListener("touchstart",(e)=>{
      _deDrag.el=handle.closest(".de-item");
      if(!_deDrag.el)return;
      _deDrag.idx=parseInt(_deDrag.el.dataset.dei);
      _deDrag.el.style.opacity="0.5";
      _deDrag.el.style.zIndex="100";
      _deDrag.placeholder=null;
    },{passive:true});
  });
  document.getElementById("viewToggle").title="Mois \u2192 Semaine \u2192 S\u00e9rie";
}

// Touch drag state (shared, initialized once)
const _deDrag={el:null,idx:null,placeholder:null};
document.addEventListener("touchmove",(e)=>{
  if(!_deDrag.el)return;
  const touch=e.touches[0];
  const target=document.elementFromPoint(touch.clientX,touch.clientY);
  const overItem=target?target.closest(".de-item"):null;
  document.querySelectorAll(".de-item").forEach(it=>{it.style.borderTop="none";});
  if(overItem&&overItem!==_deDrag.el){
    overItem.style.borderTop="2px solid var(--accent)";
    _deDrag.placeholder=overItem;
  }
},{passive:true});
document.addEventListener("touchend",()=>{
  if(!_deDrag.el)return;
  _deDrag.el.style.opacity="1";
  _deDrag.el.style.zIndex="";
  document.querySelectorAll(".de-item").forEach(it=>{it.style.borderTop="none";});
  if(_deDrag.placeholder&&editingDay){
    const toIdx=parseInt(_deDrag.placeholder.dataset.dei);
    if(_deDrag.idx!==toIdx){
      const {monday,d}=editingDay;
      const ov=loadOverrides(monday);
      const k=d+"";
      if(!ov[k])ov[k]={hidden:[],order:PLAN[d].map((_,i)=>i)};
      const order=ov[k].order||(ov[k].order=PLAN[d].map((_,i)=>i));
      const fPos=order.indexOf(_deDrag.idx);
      const tPos=order.indexOf(toIdx);
      if(fPos>-1&&tPos>-1){
        order.splice(fPos,1);
        order.splice(tPos,0,_deDrag.idx);
      }
      saveOverrides(monday,ov);
      render();
    }
  }
  _deDrag.el=null;_deDrag.idx=null;_deDrag.placeholder=null;
});

function renderCell(date,isOther,isToday){
  const dayIdx=(date.getDay()+6)%7;
  const monday=getMonday(date);
  const tasks=getTasksForDate(date);
  const isStart=startDate&&date.toDateString()===startDate.toDateString();
  const isEditing=editingDay&&editingDay.d===dayIdx&&wk(editingDay.monday)===wk(monday);
  let cls="cal-cell";
  if(isToday)cls+=" today";
  if(isOther)cls+=" other";
  if(isStart)cls+=" start-marker";
  const ds=date.toISOString().split("T")[0];
  let h=`<div class="${cls}" data-date="${ds}">`;
  const num=date.getDate();
  if(isToday){
    h+=`<div class="cal-day today"><div class="cal-today-dot">${num}</div>`;
  }else{
    h+=`<div class="cal-day"><span>${num}</span>`;
  }
  if(tasks.length>0){
    const done=tasks.filter(t=>t.isDone).length;
    const c=done===tasks.length?"background:rgba(52,199,89,0.1);color:var(--green)":done>0?"background:rgba(255,159,10,0.1);color:var(--amber)":"background:var(--g1);color:var(--g4)";
    h+=`<span class="cal-badge" style="${c}">${done}/${tasks.length}</span>`;
  }
  h+=`<button class="cal-edit-btn" data-edit="${wk(monday)}_${dayIdx}">\u270E</button>`;
  h+=`</div>`;

  // Day editor panel
  if(isEditing){
    const allTasks=PLAN[dayIdx];
    const ov=loadOverrides(monday);
    const k=dayIdx+"";
    const hidden=ov[k]&&ov[k].hidden?ov[k].hidden:[];
    const order=ov[k]&&ov[k].order?ov[k].order:allTasks.map((_,i)=>i);
    h+=`<div class="day-editor" data-ded="${wk(monday)}_${dayIdx}">`;
    order.forEach(idx=>{
      const t=allTasks[idx];
      const hid=hidden.includes(idx);
      const ser=SERIES[t.f];
      h+=`<div class="de-item${hid?" hidden":""}" draggable="true" data-dei="${idx}">
        <span class="de-handle">\u2261</span>
        <div class="cal-tk-ico" style="${brandBg(t.p)};width:14px;height:14px;border-radius:3px;flex-shrink:0"><span style="display:flex;align-items:center;justify-content:center;fill:${BRAND[t.p].text};width:8px;height:8px">${ICONS[t.p]}</span></div>
        <span class="de-lbl" style="color:${ser?ser.color:"var(--g5)"}">${t.l}</span>
        <button class="de-toggle" data-deh="${idx}">${hid?"\u{1F441}":"\u2715"}</button>
      </div>`;
    });
    h+=`</div>`;
  }

  tasks.forEach(({tk,i,d,isDone,isPrepped})=>{
    const ser=SERIES[tk.f];
    const dotCls=isDone?"pub":isPrepped?"prep":"";
    const serBg=ser?ser.color+"15":"var(--g1)";
    const serCol=ser?ser.color:"var(--g5)";
    h+=`<div class="cal-tk${isDone?" done":""}" data-tk="${ds}_${d}_${i}" style="background:${serBg};color:${serCol}">
      <div class="cal-tk-ico" style="${brandBg(tk.p)}"><span style="display:flex;align-items:center;justify-content:center;fill:${BRAND[tk.p].text};color:${BRAND[tk.p].text}">${ICONS[tk.p]}</span></div>
      <span class="cal-tk-lbl">${tk.l}</span>
      <div class="cal-tk-dot ${dotCls}"></div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

// MODAL DE PRODUCTION
// =============================================
function renderModal(){
  const mc=document.getElementById("modal");
  if(!modalTask){mc.innerHTML="";return;}

  const {date,d,i,monday}=modalTask;
  const tk=PLAN[d][i];
  const ser=SERIES[tk.f];
  const pl=P[tk.p];
  const prep=load(monday,"prep");
  const pub=load(monday,"pub");
  const steps=CT[tk.t];
  const stepsDone=getPrepSteps(prep,d,i);
  const allPrepped=stepsDone.every(Boolean);
  const isDone=!!pub[d+"_"+i];
  const epKey=getEpKey(d,i,monday);
  const epData=loadEpData(epKey);

  // Framework actif
  const fw=ser.frameworks.find(f=>f.id===(epData.framework||ser.frameworks[0].id))||ser.frameworks[0];

  let h=`<div class="modal-overlay${modalFocus?" focus-mode":""}" id="modalOverlay">`;
  h+=`<div class="modal${modalFocus?" focus":""}">`;

  // ===== HEADER =====
  h+=`<div class="m-header">
    <div class="m-plat-ico" style="${brandBg(tk.p)}"><span style="display:flex;align-items:center;justify-content:center;fill:${BRAND[tk.p].text};color:${BRAND[tk.p].text}">${ICONS[tk.p]}</span></div>
    <div class="m-header-info">
      <div class="m-header-title">${tk.l}</div>
      <div class="m-header-sub">${ser.icon} ${ser.full} \u2022 ${pl.name} \u2022 ${tk.t}</div>
    </div>
    <span class="m-save-status" id="mSaveStatus">\u2713 Sauvegardé</span>
    <button class="m-focus-btn" id="mFocus" title="${modalFocus?"Réduire":"Plein écran"}">${modalFocus?"\u2199":"\u2197"}</button>
    <button class="m-close" id="mClose">\u2715</button>
  </div>`;

  // ===== BODY =====
  h+=`<div class="m-body">`;

  // Framework selector
  h+=`<div>`;
  h+=`<div class="m-section-title">Framework</div>`;
  h+=`<div class="m-fw">`;
  ser.frameworks.forEach(f=>{
    h+=`<button class="m-fw-pill${f.id===fw.id?" on":""}" data-fwid="${f.id}">${f.name}</button>`;
  });
  h+=`</div>`;
  h+=`<div class="m-fw-steps">`;
  fw.steps.forEach((step,si)=>{
    if(si>0)h+=`<span class="m-fw-arrow">\u2192</span>`;
    h+=`<span>${step}</span>`;
  });
  h+=`</div></div>`;

  // ===== TWO COLUMNS =====
  h+=`<div class="m-cols">`;

  // === LEFT: Content fields ===
  h+=`<div class="m-col-main">`;
  h+=`<div class="m-section-title">Contenu ${ser.name}</div>`;
  h+=`<div class="m-fields">`;
  ser.fields.forEach(f=>{
    const val=epData.fields[f.key]||"";
    const escaped=val.replace(/"/g,'&quot;').replace(/</g,'&lt;');
    if(f.type==="input"){
      h+=`<div class="m-field"><label>${f.label}</label><input data-fk="${f.key}" placeholder="${f.ph}" value="${escaped}"></div>`;
    }else{
      h+=`<div class="m-field"><label>${f.label}</label><textarea data-fk="${f.key}" placeholder="${f.ph}">${val.replace(/</g,'&lt;')}</textarea></div>`;
    }
  });
  h+=`</div>`;

  // Tips série
  h+=`<div class="m-tips"><div class="m-tips-title">Tips ${ser.name}</div>`;
  ser.tips.forEach(tip=>{h+=`<div class="m-tip">${tip}</div>`;});
  h+=`</div>`;

  // ===== INSIGHTS CRÉATION (NETGUIDE allégé) =====
  const ng=NETGUIDE[tk.p];
  if(ng&&ng.cards.length>0){
    h+=`<div class="m-insights">`;
    h+=`<div class="m-insights-title">Rappels ${ng.name}</div>`;
    ng.cards.forEach(c=>{
      h+=`<div class="m-insight ${c.tag}">`;
      h+=`<span class="m-insight-tag ${c.tag}">${c.tag==="warn"?"ATTENTION":"ASTUCE"}</span> ${c.text}`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  // Adaptation plateforme
  h+=`<div class="m-adapt">`;
  h+=`<div class="m-section-title">Adaptation plateforme</div>`;
  h+=`<div class="m-fw" id="mAdaptPills">`;
  for(const [pid,pll] of Object.entries(PLAT_LIMITS)){
    h+=`<button class="m-fw-pill${modalAdaptPlatform===pid?" on":""}" data-ap="${pid}">${pll.name}</button>`;
  }
  h+=`</div>`;
  if(modalAdaptPlatform){
    const ap=PLAT_LIMITS[modalAdaptPlatform];
    const aVal=epData.adaptations[modalAdaptPlatform]||"";
    const len=aVal.length;
    const cls=len>ap.max?"over":len>ap.max*0.9?"warn":"ok";
    const pct=Math.min(100,Math.round(len/ap.max*100));
    const barCol=cls==="over"?"var(--red)":cls==="warn"?"var(--amber)":"var(--green)";
    h+=`<div class="m-adapt-area">
      <textarea id="mAdaptTA" placeholder="Adaptation ${ap.name} (optimal: ${ap.optimal})">${aVal.replace(/</g,'&lt;')}</textarea>
      <div class="m-char ${cls}">
        <span class="m-char-opt">Optimal: ${ap.optimal}</span>
        <span class="m-char-count" id="mCharCount">${len} / ${ap.max}</span>
      </div>
      <div class="m-char-bar"><div class="m-char-bar-fill" style="width:${pct}%;background:${barCol}"></div></div>
      <button class="m-copy-btn" id="mCopy" style="margin-top:6px">Copier le texte</button>
    </div>`;
  }
  h+=`</div>`;

  h+=`</div>`; // .m-col-main

  // === RIGHT: Steps + Checklist + Publish ===
  h+=`<div class="m-col-side">`;

  // Production steps
  h+=`<div class="m-sidebar">`;
  h+=`<div class="m-section-title">Production (${tk.t})</div>`;
  h+=`<div class="m-steps">`;
  steps.forEach((s,si)=>{
    h+=`<div class="m-step${stepsDone[si]?" on":""}" data-step="${si}">
      <div class="m-step-check${stepsDone[si]?" on":""}">${stepsDone[si]?"\u2713":""}</div>
      <span class="m-step-name">${s}</span>
    </div>`;
  });
  h+=`</div>`;

  // Checklist qualité (toujours ouverte)
  h+=`<div>`;
  h+=`<div style="font-size:13px;font-weight:700;margin-bottom:6px">Checklist qualité (${ser.checklist.length})</div>`;
  h+=`<div class="m-cl-items">`;
  ser.checklist.forEach((item,ci)=>{
    const checked=epData.checklist&&epData.checklist[ci];
    h+=`<div class="m-cl-item" data-ci="${ci}">
      <div class="m-cl-box${checked?" on":""}">${checked?"\u2713":""}</div>
      <span>${item}</span>
    </div>`;
  });
  h+=`</div>`;
  h+=`</div>`;

  // Publish button
  if(isDone){
    h+=`<button class="m-pub published" id="mPub">\u2713 Publié \u2014 clic pour annuler</button>`;
  }else if(allPrepped){
    h+=`<button class="m-pub ready" id="mPub">Marquer comme publié</button>`;
  }else{
    h+=`<button class="m-pub not-ready" id="mPub" disabled>Termine la préparation d'abord</button>`;
  }

  h+=`</div>`; // .m-sidebar
  h+=`</div>`; // .m-col-side

  h+=`</div>`; // .m-cols
  h+=`</div>`; // .m-body
  h+=`</div>`; // .modal
  h+=`</div>`; // .modal-overlay
  mc.innerHTML=h;

  // ===== EVENT BINDING =====
  // Close
  document.getElementById("mClose").addEventListener("click",closeModal);
  document.getElementById("modalOverlay").addEventListener("click",(e)=>{
    if(e.target.id==="modalOverlay")closeModal();
  });
  // Escape key + F for focus
  const keyHandler=(e)=>{
    if(e.key==="Escape"){closeModal();document.removeEventListener("keydown",keyHandler);}
    if(e.key==="f"&&!e.ctrlKey&&!e.metaKey&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){
      modalFocus=!modalFocus;renderModal();
    }
  };
  document.addEventListener("keydown",keyHandler);

  // Focus toggle
  document.getElementById("mFocus").addEventListener("click",()=>{
    modalFocus=!modalFocus;renderModal();
  });

  // Copy button
  const copyBtn=document.getElementById("mCopy");
  if(copyBtn){
    copyBtn.addEventListener("click",()=>{
      let text="";
      if(modalAdaptPlatform&&epData.adaptations[modalAdaptPlatform]){
        text=epData.adaptations[modalAdaptPlatform];
      }else{
        text=ser.fields.map(f=>epData.fields[f.key]||"").filter(Boolean).join("\n\n");
      }
      if(!text){copyBtn.textContent="Rien \u00e0 copier";setTimeout(()=>{copyBtn.textContent="Copier le texte";},1200);return;}
      navigator.clipboard.writeText(text).then(()=>{
        copyBtn.textContent="\u2713 Copi\u00e9 !";copyBtn.classList.add("copied");
        setTimeout(()=>{copyBtn.textContent="Copier le texte";copyBtn.classList.remove("copied");},1500);
      });
    });
  }

  // Framework pills
  mc.querySelectorAll(".m-fw-pill[data-fwid]").forEach(b=>{
    b.addEventListener("click",()=>{
      epData.framework=b.dataset.fwid;
      saveEpData(epKey,epData);
      renderModal();
    });
  });

  // Field auto-save (debounce 300ms)
  let fieldTimer;
  mc.querySelectorAll("[data-fk]").forEach(el=>{
    el.addEventListener("input",()=>{
      clearTimeout(fieldTimer);
      fieldTimer=setTimeout(()=>{
        epData.fields[el.dataset.fk]=el.value;
        saveEpData(epKey,epData);
        flashSave();
      },300);
    });
  });

  // Adaptation pills
  mc.querySelectorAll("[data-ap]").forEach(b=>{
    b.addEventListener("click",()=>{
      modalAdaptPlatform=modalAdaptPlatform===b.dataset.ap?null:b.dataset.ap;
      renderModal();
    });
  });

  // Adaptation textarea
  const adaptTA=document.getElementById("mAdaptTA");
  if(adaptTA){
    let adaptTimer;
    adaptTA.addEventListener("input",()=>{
      clearTimeout(adaptTimer);
      const ap=PLAT_LIMITS[modalAdaptPlatform];
      const len=adaptTA.value.length;
      const cls=len>ap.max?"over":len>ap.max*0.9?"warn":"ok";
      const pct=Math.min(100,Math.round(len/ap.max*100));
      const barCol=cls==="over"?"var(--red)":cls==="warn"?"var(--amber)":"var(--green)";
      const cc=document.getElementById("mCharCount");
      if(cc){cc.textContent=len+" / "+ap.max;}
      const charDiv=adaptTA.closest(".m-adapt-area").querySelector(".m-char");
      if(charDiv){charDiv.className="m-char "+cls;}
      const barFill=adaptTA.closest(".m-adapt-area").querySelector(".m-char-bar-fill");
      if(barFill){barFill.style.width=pct+"%";barFill.style.background=barCol;}
      adaptTimer=setTimeout(()=>{
        epData.adaptations[modalAdaptPlatform]=adaptTA.value;
        saveEpData(epKey,epData);
        flashSave();
      },300);
    });
  }

  // Production steps
  mc.querySelectorAll(".m-step[data-step]").forEach(el=>{
    el.addEventListener("click",()=>{
      const si=parseInt(el.dataset.step);
      toggleStep(monday,d,i,si);
      renderModal();
      render(); // update calendar dots
    });
  });

  // Checklist items
  mc.querySelectorAll(".m-cl-item[data-ci]").forEach(el=>{
    el.addEventListener("click",()=>{
      const ci=parseInt(el.dataset.ci);
      if(!epData.checklist)epData.checklist=new Array(ser.checklist.length).fill(false);
      epData.checklist[ci]=!epData.checklist[ci];
      saveEpData(epKey,epData);
      renderModal();
    });
  });

  // Publish
  const pubBtn=document.getElementById("mPub");
  if(pubBtn&&!pubBtn.disabled){
    pubBtn.addEventListener("click",()=>{
      togglePub(monday,d,i);
      renderModal();
      render();
    });
  }
}

function closeModal(){
  modalTask=null;
  modalFocus=false;
  document.getElementById("modal").innerHTML="";
}

function flashSave(){
  const ss=document.getElementById("mSaveStatus");
  if(ss){ss.classList.add("show");setTimeout(()=>{ss.classList.remove("show");},1500);}
}

});
document.getElementById("viewToggle").addEventListener("click",()=>{
  viewMode=viewMode==="month"?"week":viewMode==="week"?"series":"month";
  localStorage.setItem("nmo_rx_viewmode",viewMode);
  render();
});

render();

// =============================================
// GITHUB SYNC
// =============================================
const GH={
  repo:"bodanban/ne-moublie-pas",
  file:"nmo-data.json",
  branch:"main",
  prefix:"nmo_",
  get token(){return localStorage.getItem("nmo_gh_token")},
  set token(v){if(v)localStorage.setItem("nmo_gh_token",v);else localStorage.removeItem("nmo_gh_token")},
  sha:null,
  status:"idle", // idle|syncing|ok|err
  lastSync:null,
  debounceTimer:null,

  // Collect all NMO keys from localStorage
  collect(){
    const d={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k.startsWith(this.prefix)&&k!=="nmo_gh_token")d[k]=localStorage.getItem(k);
    }
    return d;
  },

  // Apply remote data to localStorage
  apply(data){
    if(!data||typeof data!=="object")return;
    Object.entries(data).forEach(([k,v])=>{
      if(k.startsWith(this.prefix)&&k!=="nmo_gh_token")localStorage.setItem(k,v);
    });
  },

  // Pull from GitHub
  async pull(){
    if(!this.token)return false;
    this.setStatus("syncing");
    try{
      const [owner,repo]=this.repo.split("/");
      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${this.file}?ref=${this.branch}`,{
        headers:{"Authorization":"token "+this.token,"Accept":"application/vnd.github.v3+json"}
      });
      if(!r.ok)throw new Error(r.status);
      const json=await r.json();
      this.sha=json.sha;
      const content=JSON.parse(atob(json.content.replace(/\n/g,"")));
      if(content.data)this.apply(content.data);
      this.setStatus("ok");
      this.lastSync=new Date();
      return true;
    }catch(e){
      console.warn("GH pull error:",e);
      this.setStatus("err");
      return false;
    }
  },

  // Push to GitHub
  async push(){
    if(!this.token)return false;
    this.setStatus("syncing");
    try{
      const [owner,repo]=this.repo.split("/");
      // Get latest SHA first
      const r0=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${this.file}?ref=${this.branch}`,{
        headers:{"Authorization":"token "+this.token,"Accept":"application/vnd.github.v3+json"}
      });
      if(r0.ok){const j=await r0.json();this.sha=j.sha;}

      const payload={
        _meta:{version:1,app:"nmo-reseaux",lastSync:new Date().toISOString()},
        data:this.collect()
      };
      const body={
        message:"NMO sync "+new Date().toLocaleString("fr-FR"),
        content:btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2)))),
        branch:this.branch
      };
      if(this.sha)body.sha=this.sha;

      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${this.file}`,{
        method:"PUT",
        headers:{"Authorization":"token "+this.token,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
      if(!r.ok)throw new Error(r.status);
      const res=await r.json();
      this.sha=res.content.sha;
      this.setStatus("ok");
      this.lastSync=new Date();
      return true;
    }catch(e){
      console.warn("GH push error:",e);
      this.setStatus("err");
      return false;
    }
  },

  // Debounced push — called after any data change
  schedulePush(){
    if(!this.token)return;
    clearTimeout(this.debounceTimer);
    this.debounceTimer=setTimeout(()=>this.push(),5000);
  },

  // Update UI status
  setStatus(s){
    this.status=s;
    const btn=document.getElementById("syncBtn");
    if(!btn)return;
    btn.className="sync-btn"+(s==="syncing"?" syncing":s==="ok"?" ok":s==="err"?" err":"");
    const lbl=btn.querySelector(".sync-lbl");
    if(lbl)lbl.textContent=s==="syncing"?"Sync...":s==="ok"?"Sync OK":s==="err"?"Erreur":"Sync";
    if(s==="ok")setTimeout(()=>{if(this.status==="ok"){btn.className="sync-btn";if(lbl)lbl.textContent="Sync";}},3000);
  },

  // Show setup modal
  showSetup(){
    const el=document.createElement("div");
    el.className="sync-setup";
    el.id="syncSetup";
    el.innerHTML=`<div class="sync-box">
      <h3>Sync GitHub</h3>
      <p>Connecte ton GitHub pour synchroniser tes donn\u00e9es entre tous tes appareils.<br><br>
      Cr\u00e9e un token sur <strong>github.com/settings/tokens</strong> avec le scope <strong>repo</strong>.</p>
      <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" value="${this.token||""}">
      <div class="sync-box-btns">
        <button class="secondary" id="syncCancel">Annuler</button>
        <button class="primary" id="syncSave">Connecter</button>
      </div>
    </div>`;
    document.body.appendChild(el);
    document.getElementById("syncCancel").addEventListener("click",()=>el.remove());
    document.getElementById("syncSave").addEventListener("click",async()=>{
      const t=document.getElementById("ghTokenInput").value.trim();
      if(!t)return;
      this.token=t;
      el.remove();
      await this.pull();
      render();
    });
  },

  // Init — pull on first load
  async init(){
    if(this.token){
      await this.pull();
      render();
    }
  }
};

// Hook into localStorage saves — monkey-patch to auto-push
const _origSetItem=localStorage.setItem.bind(localStorage);
localStorage.setItem=function(k,v){
  _origSetItem(k,v);
  if(k.startsWith("nmo_")&&k!=="nmo_gh_token")GH.schedulePush();
};

// Init sync
GH.init();
</script>
